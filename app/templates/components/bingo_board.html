<div class="grid grid-cols-5 gap-2 w-full max-w-lg mx-auto aspect-square bingo-grid">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="bingo-tile relative flex items-center justify-center p-3 text-center transition-all duration-150 select-none min-h-[70px] text-[0.78rem] leading-tight
        {%- if square.is_marked %}
            {%- if is_winning %} tile-winning
            {%- else %} tile-marked
            {%- endif %}
        {%- else %} tile-normal hover-tile
        {%- endif %}
        {%- if square.is_free_space %} free-space font-bold text-sm{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="checkmark">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
